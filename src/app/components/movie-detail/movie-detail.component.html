<div class="movie-detail-page" *ngIf="movie; else notFound">
  <mat-card class="movie-detail-card">
    <div class="movie-detail-content">
      
      <!-- Poster -->
      <div class="poster">
        <img
          [src]="movie.posterUrl || 'https://via.placeholder.com/300x450?text=No+Poster'"
          [alt]="movie.title"
        />
      </div>

      <!-- Infos -->
      <div class="info">
        <h1 class="title">{{ movie.title }}</h1>

        <div class="meta">
          <mat-chip selected>{{ movie.genre }}</mat-chip>
          <mat-chip>{{ movie.year }}</mat-chip>
        </div>

        <div class="rating" role="img" [attr.aria-label]="'Rating: ' + movie.rating + ' out of 10'">
          <span class="star-icon" aria-hidden="true">⭐</span>
          <span>{{ movie.rating }}</span>/10
        </div>

        <p class="description">
          {{ movie.description }}
        </p>

        <div class="actions">
          <button mat-raised-button [routerLink]="['/movies', movie.id, 'edit']">
            Edit
          </button>
          <button mat-raised-button color="warn" (click)="openDeleteDialog()">
            Delete
          </button>
          <button mat-stroked-button routerLink="/movies">
            Back
          </button>
        </div>
      </div>

    </div>
  </mat-card>
</div>

<ng-template #notFound>
  <mat-card class="not-found">
    Movie not found.
  </mat-card>
</ng-template>
