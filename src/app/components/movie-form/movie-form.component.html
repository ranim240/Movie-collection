 <div class="form-page">
      <div class="back-nav">
        <button mat-button (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
          Back
        </button>
      </div>

      <mat-card class="form-card">
        <mat-card-header>
          <mat-card-title>{{ isEditMode ? 'Edit Movie' : 'Add New Movie' }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
          <form [formGroup]="movieForm" (ngSubmit)="onSubmit()">
            <div class="form-grid">
              <div class="form-left">
                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Title</mat-label>
                  <input matInput formControlName="title" placeholder="Enter movie title">
                  <mat-error *ngIf="movieForm.get('title')?.hasError('required')">Title is required</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Genre</mat-label>
                  <mat-select formControlName="genre">
                    <mat-option *ngFor="let genre of genres" [value]="genre">{{ genre }}</mat-option>
                  </mat-select>
                  <mat-error *ngIf="movieForm.get('genre')?.hasError('required')">Genre is required</mat-error>
                </mat-form-field>

                <div class="form-row">
                  <mat-form-field appearance="outline">
                    <mat-label>Year</mat-label>
                    <input matInput type="number" formControlName="year" placeholder="2024">
                    <mat-error *ngIf="movieForm.get('year')?.hasError('required')">Year is required</mat-error>
                    <mat-error *ngIf="movieForm.get('year')?.hasError('min') || movieForm.get('year')?.hasError('max')">
                      Enter a valid year
                    </mat-error>
                  </mat-form-field>

                  <mat-form-field appearance="outline">
                    <mat-label>Rating (0-10)</mat-label>
                    <input matInput type="number" formControlName="rating" placeholder="8.5" step="0.1">
                    <mat-error *ngIf="movieForm.get('rating')?.hasError('required')">Rating is required</mat-error>
                    <mat-error *ngIf="movieForm.get('rating')?.hasError('min') || movieForm.get('rating')?.hasError('max')">
                      Rating must be 0-10
                    </mat-error>
                  </mat-form-field>
                </div>

                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Poster URL</mat-label>
                  <input matInput formControlName="posterUrl" placeholder="https://example.com/poster.jpg">
                  <mat-icon matSuffix>image</mat-icon>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                  <mat-label>Description</mat-label>
                  <textarea matInput formControlName="description" rows="5" placeholder="Enter movie description..."></textarea>
                </mat-form-field>
              </div>

              <div class="form-right">
                <div class="poster-preview">
                  <img [src]="posterPreview" alt="Poster preview" (error)="onPreviewError($event)">
                  <div class="preview-label">Poster Preview</div>
                </div>
              </div>
            </div>

            <div class="form-actions">
              <button mat-button type="button" (click)="goBack()">Cancel</button>
              <button mat-raised-button color="primary" type="submit" [disabled]="movieForm.invalid">
                <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
                {{ isEditMode ? 'Save Changes' : 'Add Movie' }}
              </button>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
